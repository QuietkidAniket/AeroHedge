<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AeroHedge Execution Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .stats { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px; }
        .stat-value { font-weight: bold; color: #00e676; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <h2>AeroHedge Telemetry</h2>
    
    <div class="stats card">
        <div>Position: <span id="pos-val" class="stat-value">0</span></div>
        <div>Delta: <span id="delta-val" class="stat-value">0.00</span></div>
        <div>Realized P&L: $<span id="pnl-val" class="stat-value">0</span></div>
        <div>Last Latency: <span id="lat-val" class="stat-value">0</span> ns</div>
    </div>

    <div class="grid">
        <div class="card">
            <canvas id="priceChart"></canvas>
        </div>
        <div class="card">
            <canvas id="latencyChart"></canvas>
        </div>
    </div>

    <script>
        // Setup Charts
        const commonOptions = { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false } } };
        
        const priceCtx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(priceCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Stock Price', borderColor: '#29b6f6', data: [], pointRadius: 0, borderWidth: 2 }] },
            options: commonOptions
        });

        const latCtx = document.getElementById('latencyChart').getContext('2d');
        const latencyChart = new Chart(latCtx, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Execution Latency (ns)', backgroundColor: '#ff5252', data: [] }] },
            options: commonOptions
        });

        // Maximum data points on screen
        const MAX_POINTS = 50;

        // Connect WebSocket
        const ws = new WebSocket('ws://localhost:8765');
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Update Text Stats
            document.getElementById('pos-val').innerText = data.position;
            document.getElementById('delta-val').innerText = data.delta;
            document.getElementById('pnl-val').innerText = data.pnl;
            document.getElementById('lat-val').innerText = data.latency;

            // Update Price Chart
            priceChart.data.labels.push('');
            priceChart.data.datasets[0].data.push(data.price);
            if (priceChart.data.labels.length > MAX_POINTS) {
                priceChart.data.labels.shift();
                priceChart.data.datasets[0].data.shift();
            }
            priceChart.update();

            // Update Latency Chart
            if (data.latency > 0) {
                latencyChart.data.labels.push('');
                latencyChart.data.datasets[0].data.push(data.latency);
                if (latencyChart.data.labels.length > MAX_POINTS) {
                    latencyChart.data.labels.shift();
                    latencyChart.data.datasets[0].data.shift();
                }
                latencyChart.update();
            }
        };

        ws.onopen = () => console.log('Connected to AeroHedge telemetry.');
        ws.onerror = (e) => console.error('WebSocket Error:', e);
    </script>
</body>
</html>
