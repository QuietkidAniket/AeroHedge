<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroHedge Pro Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151924;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --buy-color: #22ab94;
            --sell-color: #f23645;
            --highlight: #2962ff;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Bar: Ticker and Quote */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 25px;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .ticker-info { display: flex; align-items: baseline; gap: 15px; }
        .symbol { font-size: 2rem; font-weight: 800; letter-spacing: 1px; color: #ffffff;}
        .last-price { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        .order-book-top { display: flex; gap: 40px; }
        .quote-box { display: flex; flex-direction: column; align-items: flex-end; }
        .quote-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700;}
        .quote-value { font-size: 1.5rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .quote-bid { color: var(--buy-color); }
        .quote-ask { color: var(--sell-color); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700;}
        .stat-data { font-size: 1.6rem; font-weight: bold; font-variant-numeric: tabular-nums;}
        
        .val-neutral { color: var(--text-main); }
        .val-pnl { color: var(--highlight); }

        /* Chart Layout (Vertical) */
        .charts-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chart-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            height: 350px;
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .top-bar { padding: 15px; }
            .order-book-top { width: 100%; justify-content: space-between; gap: 10px;}
            .ticker-info { width: 100%; justify-content: space-between; }
            .chart-container { height: 280px; padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .quote-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="ticker-info">
                <div class="symbol">SIM_EQ</div>
                <div class="last-price" id="last-price-val">100.00</div>
            </div>
            <div class="order-book-top">
                <div class="quote-box">
                    <div class="quote-label">Bid</div>
                    <div class="quote-value quote-bid" id="bid-val">99.99</div>
                </div>
                <div class="quote-box">
                    <div class="quote-label">Ask</div>
                    <div class="quote-value quote-ask" id="ask-val">100.01</div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Inventory Position</div>
                <div class="stat-data val-neutral" id="pos-val">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Option Delta</div>
                <div class="stat-data val-neutral" id="delta-val">0.000</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Realized P&L</div>
                <div class="stat-data val-pnl">$<span id="pnl-val">0.00</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Execution Latency</div>
                <div class="stat-data val-neutral"><span id="lat-val">0</span> ns</div>
            </div>
        </div>

        <div class="charts-layout">
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Common styling for dark mode charts
        const gridColor = '#2a2e39';
        const textColor = '#787b86';

        const commonOptions = { 
            responsive: true, 
            maintainAspectRatio: false, 
            animation: false, 
            plugins: {
                legend: { labels: { color: textColor, font: { weight: 'bold' } } }
            },
            scales: { 
                x: { 
                    grid: { color: gridColor }, 
                    ticks: { color: textColor, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } 
                },
                y: { 
                    grid: { color: gridColor }, 
                    ticks: { color: textColor } 
                } 
            } 
        };
        
        // Price Chart (Filled Line)
        const priceCtx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(priceCtx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Underlying Asset Price', 
                    borderColor: '#2962ff', 
                    backgroundColor: 'rgba(41, 98, 255, 0.1)',
                    data: [], 
                    pointRadius: 0, 
                    borderWidth: 2,
                    fill: true,
                    tension: 0.1
                }] 
            },
            options: commonOptions
        });

        // Latency Chart (Color Coded Bars)
        const latCtx = document.getElementById('latencyChart').getContext('2d');
        const latencyChart = new Chart(latCtx, {
            type: 'bar',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Critical Path Latency (nanoseconds)', 
                    backgroundColor: [], // Dynamically populated
                    data: [],
                    borderRadius: 2
                }] 
            },
            options: commonOptions
        });

        // Maximum data points on screen
        const MAX_POINTS = 60;

        // Connect WebSocket
        const ws = new WebSocket('ws://localhost:8765');
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Format time from C++ nanoseconds to HH:MM:SS.ms
            const date = new Date(data.timestamp / 1000000);
            const timeString = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}.${date.getMilliseconds().toString().padStart(3, '0')}`;

            // Update Top Bar & Bid/Ask (Simulating a tight 2-cent spread)
            document.getElementById('last-price-val').innerText = data.price.toFixed(2);
            document.getElementById('bid-val').innerText = (data.price - 0.01).toFixed(2);
            document.getElementById('ask-val').innerText = (data.price + 0.01).toFixed(2);

            // Update Text Stats
            document.getElementById('pos-val').innerText = data.position;
            document.getElementById('delta-val').innerText = data.delta.toFixed(3);
            document.getElementById('pnl-val').innerText = data.pnl.toFixed(2);
            document.getElementById('lat-val').innerText = data.latency;

            // Update Price Chart
            priceChart.data.labels.push(timeString);
            priceChart.data.datasets[0].data.push(data.price);
            if (priceChart.data.labels.length > MAX_POINTS) {
                priceChart.data.labels.shift();
                priceChart.data.datasets[0].data.shift();
            }
            priceChart.update();

            // Update Latency Chart
            if (data.latency > 0) {
                // Color Code: Green < 500ns, Yellow < 1000ns, Red > 1000ns
                let barColor = '#22ab94'; 
                if (data.latency > 1000) barColor = '#f23645';
                else if (data.latency > 500) barColor = '#ffeb3b';

                latencyChart.data.labels.push(timeString);
                latencyChart.data.datasets[0].data.push(data.latency);
                latencyChart.data.datasets[0].backgroundColor.push(barColor);

                if (latencyChart.data.labels.length > MAX_POINTS) {
                    latencyChart.data.labels.shift();
                    latencyChart.data.datasets[0].data.shift();
                    latencyChart.data.datasets[0].backgroundColor.shift();
                }
                latencyChart.update();
            }
        };

        ws.onopen = () => console.log('Connected to AeroHedge telemetry.');
        ws.onerror = (e) => console.error('WebSocket Error:', e);
    </script>
</body>
</html>
